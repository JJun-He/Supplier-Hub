spring:
  application:
    name: supplier-hub

  main:
    web-application-type: servlet

  config:
    import: optional:file:./.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supplier_hub}
    username: ${DB_USERNAME:supplier_hub}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: ${DB_ACQUIRE_TIMEOUT_MS:500}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:250}
      data-source-properties:
        connectTimeout: ${DB_CONNECT_TIMEOUT_SECONDS:2}
        socketTimeout: ${DB_SOCKET_TIMEOUT_SECONDS:15}
        options: "-c statement_timeout=${DB_STATEMENT_TIMEOUT_MS:10000} -c lock_timeout=${DB_LOCK_TIMEOUT_MS:2000}"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  shutdown: graceful

catalog:
  database:
    read-statement-timeout: ${CATALOG_DB_READ_STATEMENT_TIMEOUT:1s}
    read-lock-timeout: ${CATALOG_DB_READ_LOCK_TIMEOUT:300ms}
    write-transaction-timeout-seconds: ${CATALOG_DB_WRITE_TRANSACTION_TIMEOUT_SECONDS:10}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

supplier:
  a:
    enabled: ${SUPPLIER_A_ENABLED:true}
    base-url: ${SUPPLIER_A_BASE_URL:http://localhost:18080}
    api-key: ${SUPPLIER_A_API_KEY:mock-a-key}
  b:
    enabled: ${SUPPLIER_B_ENABLED:true}
    base-url: ${SUPPLIER_B_BASE_URL:http://localhost:18080}
    api-key: ${SUPPLIER_B_API_KEY:mock-b-key}
  catalog:
    enabled: ${SUPPLIER_CATALOG_ENABLED:true}
    connect-timeout: ${SUPPLIER_CATALOG_CONNECT_TIMEOUT:500ms}
    response-timeout: ${SUPPLIER_CATALOG_RESPONSE_TIMEOUT:3s}
    call-timeout: ${SUPPLIER_CATALOG_CALL_TIMEOUT:4s}
    max-retries: ${SUPPLIER_CATALOG_MAX_RETRIES:2}
    retry-backoff: ${SUPPLIER_CATALOG_RETRY_BACKOFF:300ms}
    initial-delay: ${SUPPLIER_CATALOG_INITIAL_DELAY:0}
    fixed-delay: ${SUPPLIER_CATALOG_FIXED_DELAY:10m}
    bulk-missing-minimum-count: ${SUPPLIER_CATALOG_BULK_MISSING_MINIMUM_COUNT:10}
    maximum-missing-ratio: ${SUPPLIER_CATALOG_MAXIMUM_MISSING_RATIO:0.5}
  search:
    connect-timeout: ${SUPPLIER_SEARCH_CONNECT_TIMEOUT:500ms}
    response-timeout: ${SUPPLIER_SEARCH_RESPONSE_TIMEOUT:2s}
    call-timeout: ${SUPPLIER_SEARCH_CALL_TIMEOUT:3s}
    overall-timeout: ${SUPPLIER_SEARCH_OVERALL_TIMEOUT:5s}
    max-concurrency: ${SUPPLIER_SEARCH_MAX_CONCURRENCY:4}

  resources:
    search:
      max-concurrent-calls: ${SUPPLIER_SEARCH_GLOBAL_CONCURRENCY:8}
      max-response-bytes: ${SUPPLIER_SEARCH_MAX_RESPONSE_BYTES:2097152}
      pending-acquire-max-count: ${SUPPLIER_SEARCH_POOL_PENDING_COUNT:8}
      pending-acquire-timeout: ${SUPPLIER_SEARCH_POOL_ACQUIRE_TIMEOUT:200ms}
    catalog:
      max-concurrent-calls: ${SUPPLIER_CATALOG_GLOBAL_CONCURRENCY:1}
      max-response-bytes: ${SUPPLIER_CATALOG_MAX_RESPONSE_BYTES:8388608}
      pending-acquire-max-count: ${SUPPLIER_CATALOG_POOL_PENDING_COUNT:1}
      pending-acquire-timeout: ${SUPPLIER_CATALOG_POOL_ACQUIRE_TIMEOUT:200ms}
